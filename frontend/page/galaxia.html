<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link rel="stylesheet" href="../css/estilos_galaxia.css">
</head>
<body>

  <nav class="navbar mapa-navbar" role="navigation">
    <div class="navbar-menu is-active">
      <div class="navbar-start">
        <a class="navbar-item" href="galaxia.html">Mapa</a>
        <a class="navbar-item" href="misiones.html">Misiones</a>
        <a class="navbar-item" href="admin.html">Administrador</a>
      </div>
    </div>
  </nav>

  <section class="mapa-galaxia">
    <video autoplay muted loop playsinline class="video-fondo">

    </video>
    <div class="planetas-contenedor" id="planetas-contenedor">

      <div class="planeta planeta-tierra" id="p-tierra">
        <img src="../assets/tierra.png" alt="Tierra">
        <p class="nombre-planeta">La Tierra</p>
      </div>

      <div class="planeta" id="p-marte">
        <img src="../assets/marte.png" alt="Marte">
        <p class="nombre-planeta">Marte</p>
      </div>

      <div class="planeta" id="p-mercurio">
        <img src="../assets/mercurio.png" alt="Mercurio">
        <p class="nombre-planeta">Mercurio</p>
      </div>

    </div>

  <script src="../js/galaxia.js"></script>
