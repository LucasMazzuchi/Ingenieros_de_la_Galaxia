<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valle Seco</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link rel="stylesheet" href="../css/punto_interes.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body>

  <section class="interior-punto">
    <img src="../assets/img/valle-seco.png" class="fondo-punto">

    <div class="info-punto">
      <h1 class="nombre-punto">Valle Seco</h1>
      <p class="descripcion-punto">
        Un cauce que alguna vez transportó agua líquida, hoy convertido en un laberinto de piedra reseca. Las formaciones talladas por el viento dibujan siluetas fantasmales bajo el cielo anaranjado del atardecer marciano.
      </p>
    </div>

    <button class="button is-primary volver" id="btnVolver">Volver</button>
  </section>

  <script src="../js/punto_interes.js"></script>
</body>
</html>
