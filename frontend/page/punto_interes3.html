<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base Antigua</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link rel="stylesheet" href="../css/punto_interes.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body>

  <section class="interior-punto">
    <img src="../assets/img/base-antigua.png" class="fondo-punto">

    <div class="info-punto">
      <h1 class="nombre-punto">Base Antigua</h1>
      <p class="descripcion-punto">
        Los restos oxidados de una estación de investigación abandonada. Nadie sabe qué ocurrió con su tripulación, pero los paneles solares aún giran lentamente, como esperando el regreso de alguien que nunca volvió.
      </p>
    </div>

    <button class="button is-primary volver" id="btnVolver">Volver</button>
  </section>

  <script src="../js/punto_interes.js"></script>
</body>
</html>
