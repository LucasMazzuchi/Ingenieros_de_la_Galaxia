<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planeta</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link rel="stylesheet" href="../css/planeta.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet"> 
</head>
<body>

  <section class="interior-planeta">

    <!-- Imagen de fondo que cambiará según el planeta -->
    <img id="fondo-planeta" src="../assets/img/fondo-marte.png" class="fondo-planeta">

    <!-- Título del planeta que vendrá de la BD -->
    <h1 id="nombre-planeta" class="nombre-planeta-interior">Cargando...</h1>

    <!-- SVG dinámico para trazar la línea entre puntos -->
    <svg class="camino-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <polyline id="camino-polyline" points="" />
    </svg>

    <!-- Contenedor donde JS inyectará los puntos de interés reales -->
    <div id="contenedor-puntos"></div>

    <!-- Vehículo espacial -->
    <img src="../assets/img/nave.png" class="vehiculo" id="vehiculo" style="top:15%; left:12%;">

  </section>

  <script src="../js/planeta.js"></script>
</body>
</html>
