<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planeta</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link rel="stylesheet" href="../css/planeta.css">
  <link rel="stylesheet" href="../css/pie.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet"> 
</head>
<body>

  <section class="interior-planeta" id="mapa-planeta">
    
    <h1 id="nombre-planeta" class="nombre-planeta-interior"></h1>

    <a href="galaxia.html" class="button is-primary volver">Volver</a>

    <button class="boton-info" id="botonInfo" aria-label="Mostrar información del planeta">
      <span class="flecha">‹</span>
    </button>

    <aside class="panel-planeta" id="panelPlaneta">
      <h2 class="panel-titulo">Datos del planeta</h2>
      <ul class="panel-datos">
        <li><span class="dato-nombre">Tipo</span><span class="dato-valor" id="datoTipo"></span></li>
        <li><span class="dato-nombre">Diámetro</span><span class="dato-valor" id="datoDiametro"></span></li>
        <li><span class="dato-nombre">Gravedad</span><span class="dato-valor" id="datoGravedad"></span></li>
        <li><span class="dato-nombre">Temperatura</span><span class="dato-valor" id="datoTemperatura"></span></li>
        <li><span class="dato-nombre">Terreno</span><span class="dato-valor" id="datoTerreno"></span></li>
        <li><span class="dato-nombre">Habitable</span><span class="dato-valor" id="datoHabitable"></span></li>
      </ul>
    </aside>

    <aside class="panel-punto" id="panelPunto">
      <h2 class="nombre-punto" id="puntoNombre"></h2>
      <p class="descripcion-punto" id="puntoDescripcion"></p>
      <button class="button is-primary cerrar-panel-punto" id="btnCerrarPanelPunto">Volver</button>
    </aside>

    <svg class="camino-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <polyline id="camino-polyline" points="12,15 78,50 20,85" />
    </svg>

    <img src="../assets/img/nave1.png" class="vehiculo" id="vehiculo">

  </section>
<script type="module" src="../js/planeta.js"></script>
  <footer class="pie-pagina">
    <p>&copy; 2026 Todos los derechos reservados — Ingenieros de Galaxia</p>
  </footer>

</body>
</html>
