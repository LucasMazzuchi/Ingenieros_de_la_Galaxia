<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cráter Rojo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link rel="stylesheet" href="../css/punto_interes.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body>

  <section class="interior-punto">
    <img src="../assets/img/crater-rojo.png" class="fondo-punto">

    <div class="info-punto">
      <h1 class="nombre-punto">Cráter Rojo</h1>
      <p class="descripcion-punto">
        Una vasta depresión de suelo rojizo, formada hace millones de años por el impacto de un meteorito. El óxido de hierro tiñe cada roca con tonos carmesí, y en sus profundidades aún quedan restos de antiguas expediciones perdidas.
      </p>
    </div>

    <button class="button is-primary volver" id="btnVolver">Volver</button>
  </section>

  <script src="../js/punto_interes.js"></script>
</body>
</html>
